<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Voting App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-wrapper">
    <!-- Top Header & Admin Toggle -->
    <div class="top-bar">
      <span class="badge" id="poll-status">Live Poll</span>
      <button id="toggle-admin-btn" class="secondary-btn">⚙️ Setup Poll</button>
    </div>

    <!-- Collapsible Poll Creator Panel -->
    <div id="admin-panel" class="admin-panel hidden">
      <h3>Create / Edit Poll</h3>
      <input type="text" id="poll-title-input" placeholder="Enter poll question (e.g., Best Team Lead?)">
      
      <div class="timer-setup">
        <label for="timer-minutes">Duration (minutes):</label>
        <input type="number" id="timer-minutes" value="5" min="1" max="1440">
      </div>

      <div class="add-candidate-row">
        <input type="text" id="new-candidate-name" placeholder="Candidate name">
        <input type="text" id="new-candidate-role" placeholder="Role / Party (optional)">
        <button id="add-candidate-btn" class="primary-btn">+ Add</button>
      </div>

      <ul id="admin-candidate-list" class="admin-list"></ul>
      <button id="start-poll-btn" class="success-btn full-width">Launch New Poll</button>
    </div>

    <!-- Main Voting Card -->
    <div class="poll-container">
      <div class="poll-header">
        <h2 id="poll-title">Who should be the next Project Lead?</h2>
        <div class="timer-box">⏳ <span id="countdown">05:00</span></div>
      </div>

      <div id="winner-banner" class="winner-banner hidden"></div>
      <div id="options-list"></div>

      <div class="footer-row">
        <button id="reset-vote-btn" class="secondary-btn">Clear My Vote</button>
        <span class="total-votes">Total Votes: <strong id="total-count">0</strong></span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
